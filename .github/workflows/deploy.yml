name: Codex Dynamics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mongodb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install MongoDB PHP library
        run: composer install --no-dev --prefer-dist --optimize-autoloader --working-dir=public/api

      - name: Verify PHP dependencies
        run: |
          test -f public/api/vendor/autoload.php
          php -r 'require "public/api/vendor/autoload.php"; if (!class_exists("MongoDB\\Client")) { exit(1); }'

      - name: Build website
        run: |
          npm ci
          npm run build

      - name: Add PHP API to deployment artifact
        run: |
          mkdir -p dist/api
          cp -R public/api/. dist/api/
          test -f dist/api/vendor/autoload.php
          php -l dist/api/index.php

      - name: Deploy website to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
